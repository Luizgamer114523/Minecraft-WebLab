name: Build Sentinela PPCS Bridge APK

on:
  push:
    branches: [main]
    paths:
      - "bridge/android/**"
      - ".github/workflows/build-ppcs-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build bridge APK
        run: gradle -p bridge/android :app:assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinela-ppcs-bridge-debug
          path: bridge/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
