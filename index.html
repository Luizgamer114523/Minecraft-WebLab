<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17251d"><title>Minecraft WebLab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87bce8;font-family:system-ui,Arial;color:white}#game{position:fixed;inset:0}canvas{display:block}
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 4px #000}
#brand{font-weight:800;letter-spacing:.5px}#stats{font-size:12px;text-align:right}
#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:26px;text-shadow:0 1px 3px #000;pointer-events:none}
#hotbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:6px;background:#10182099;border:2px solid #ffffff88;border-radius:8px}
.slot{width:48px;height:48px;border:2px solid #ffffff55;border-radius:5px;background:#263238bb;display:grid;place-items:center;font-size:11px}.slot.active{border:3px solid white;background:#ffffff44}.swatch{width:23px;height:23px;border:1px solid #ffffff77}
#help{position:fixed;top:55px;left:12px;background:#10182099;padding:8px 10px;border-radius:6px;font-size:12px;max-width:230px}
#actions{position:fixed;right:16px;bottom:95px;display:flex;flex-direction:column;gap:10px}
button{border:1px solid #ffffff99;background:#15251dcc;color:white;border-radius:9px;padding:12px;font-weight:700;touch-action: manipulation}
#move{position:fixed;left:16px;bottom:95px;display:none;gap:8px}#move button{width:54px;height:54px;padding:0;font-size:20px}
@media(pointer:coarse){#move{display:grid;grid-template-columns:repeat(3,54px)}#help{max-width:190px}#hotbar{bottom:12px}.slot{width:39px;height:42px}}
#overlay{position:fixed;inset:0;background:#101820bb;display:grid;place-items:center;text-align:center;padding:24px}
.panel{max-width:430px;background:#17251df2;border:1px solid #ffffff44;border-radius:16px;padding:24px;box-shadow:0 15px 50px #0008}.panel h1{margin:0 0 8px}.panel p{color:#d2ded5;line-height:1.5}#start{background:#4b9b51;border:0;padding:14px 24px;font-size:16px}
</style>
</head>
<body><div id="game"></div>
<div id="top"><div id="brand">MINECRAFT WEBLAB <small>0.1.0</small></div><div id="stats">Carregando mundo…</div></div>
<div id="help">WASD mover · Espaço pular · Clique quebrar · Botão direito colocar · 1–5 selecionar</div><div id="cross">+</div>
<div id="hotbar"></div><div id="actions"><button id="break">⛏ Quebrar</button><button id="place">▣ Colocar</button><button id="save">Salvar mundo</button></div>
<div id="move"><button data-k="w">▲</button><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div>
<div id="overlay"><div class="panel"><h1>Minecraft WebLab</h1><p>Protótipo independente de mundo voxel, inspirado em mecânicas de sandbox. Toque para iniciar. No celular, arraste a tela para olhar e use os botões.</p><button id="start">Entrar no mundo</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const mount=document.querySelector('#game'),stats=document.querySelector('#stats');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87bce8);scene.fog=new THREE.Fog(0x87bce8,24,70);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,120);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9efff,0x66734b,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(20,35,12);scene.add(sun);
const mats={grass:new THREE.MeshLambertMaterial({color:0x62a844}),dirt:new THREE.MeshLambertMaterial({color:0x805334}),stone:new THREE.MeshLambertMaterial({color:0x858b8c}),wood:new THREE.MeshLambertMaterial({color:0x80552f}),leaves:new THREE.MeshLambertMaterial({color:0x397d39}),sand:new THREE.MeshLambertMaterial({color:0xd9c27b})};
const geo=new THREE.BoxGeometry(1,1,1),blocks=new Map(),meshes=[];const key=(x,y,z)=>x+','+y+','+z;
function add(x,y,z,type){const k=key(x,y,z);if(blocks.has(k))return;const m=new THREE.Mesh(geo,mats[type]||mats.dirt);m.position.set(x,y,z);m.userData={x,y,z,type};scene.add(m);blocks.set(k,m);meshes.push(m)}
function remove(m){scene.remove(m);blocks.delete(key(m.userData.x,m.userData.y,m.userData.z));}
let seed=93841;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function height(x,z){return Math.floor(2+Math.sin(x*.23)*1.3+Math.cos(z*.19)*1.2+Math.sin((x+z)*.11)*.8)}
for(let x=-16;x<=16;x++)for(let z=-16;z<=16;z++){let h=height(x,z);for(let y=-2;y<h;y++)add(x,y,z,y===h-1?'grass':y>-2?'dirt':'stone');if(rand()>.986&&Math.abs(x)>2&&Math.abs(z)>2){for(let y=h;y<h+4;y++)add(x,y,z,'wood');for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=2;dy<=4;dy++)if(Math.abs(dx)+Math.abs(dz)+(dy===4?1:0)<5)add(x+dx,h+dy,z+dz,'leaves')}}
const player={pos:new THREE.Vector3(0,7,7),vel:new THREE.Vector3(),yaw:0,pitch:0,onGround:false};camera.position.copy(player.pos);
const ray=new THREE.Raycaster();let selected='dirt',selectedIndex=1;const types=['grass','dirt','stone','wood','sand'];const bar=document.querySelector('#hotbar');
types.forEach((t,i)=>{let e=document.createElement('div');e.className='slot'+(i===1?' active':'');e.innerHTML='<div class="swatch" style="background:'+({grass:'#62a844',dirt:'#805334',stone:'#858b8c',wood:'#80552f',sand:'#d9c27b'}[t])+'"></div><small>'+(i+1)+'</small>';e.onclick=()=>select(i);bar.append(e)});
function select(i){selectedIndex=i;selected=types[i];[...bar.children].forEach((e,j)=>e.classList.toggle('active',j===i))}
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if('12345'.includes(e.key))select(+e.key-1)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let locked=false;document.querySelector('#start').onclick=()=>{document.querySelector('#overlay').style.display='none';if(matchMedia('(pointer:fine)').matches)renderer.domElement.requestPointerLock?.()};
document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);
addEventListener('mousemove',e=>{if(locked){player.yaw-=e.movementX*.002;player.pitch=Math.max(-1.45,Math.min(1.45,player.pitch-e.movementY*.002))}});
let touch=null;renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length){touch={x:e.touches[0].clientX,y:e.touches[0].clientY}}},{passive:true});renderer.domElement.addEventListener('touchmove',e=>{if(touch&&e.touches.length){let t=e.touches[0];player.yaw-=(t.clientX-touch.x)*.006;player.pitch=Math.max(-1.35,Math.min(1.35,player.pitch-(t.clientY-touch.y)*.006));touch={x:t.clientX,y:t.clientY}}},{passive:true});renderer.domElement.addEventListener('touchend',()=>touch=null);
document.querySelectorAll('#move button').forEach(b=>{let k=b.dataset.k;b.addEventListener('touchstart',e=>{e.preventDefault();keys[k]=true});['touchend','touchcancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
function target(){camera.updateMatrixWorld();ray.setFromCamera(new THREE.Vector2(0,0),camera);return ray.intersectObjects(meshes,false).find(h=>h.distance<6)}
function mine(){let h=target();if(h)remove(h.object)}
function put(){let h=target();if(!h)return;let p=h.object.position.clone().add(h.face.normal);let x=Math.round(p.x),y=Math.round(p.y),z=Math.round(p.z);if(Math.abs(x-player.pos.x)<.8&&Math.abs(z-player.pos.z)<.8&&Math.abs(y-player.pos.y)<1.8)return;add(x,y,z,selected)}
renderer.domElement.addEventListener('click',()=>{if(!locked&&!matchMedia('(pointer:coarse)').matches)return;mine()});renderer.domElement.addEventListener('contextmenu',e=>{e.preventDefault();put()});document.querySelector('#break').onclick=mine;document.querySelector('#place').onclick=put;
document.querySelector('#save').onclick=()=>{let data=[...blocks.values()].map(m=>m.userData);localStorage.setItem('weblab-world',JSON.stringify({data,pos:player.pos.toArray(),seed}));stats.textContent='Mundo salvo localmente';};
function load(){try{let s=JSON.parse(localStorage.getItem('weblab-world'));if(s?.data?.length){blocks.forEach?.(()=>{});for(const m of [...blocks.values()])remove(m);s.data.forEach(b=>add(b.x,b.y,b.z,b.type));player.pos.fromArray(s.pos||[0,7,7]);seed=s.seed||seed}}catch{}}
load();
function collides(x,y,z){for(let dx of [-.25,.25])for(let dz of [-.25,.25])for(let dy of [-.8,.8])if(blocks.has(key(Math.floor(x+dx+.5),Math.floor(y+dy+.5),Math.floor(z+dz+.5))))return true;return false}
let last=performance.now(),frames=0,stamp=last;
function loop(now){requestAnimationFrame(loop);let dt=Math.min((now-last)/1000,.04);last=now;
let forward=(keys.w?1:0)-(keys.s?1:0),side=(keys.d?1:0)-(keys.a?1:0);let speed=keys.shift?8:5;let vx=(Math.sin(player.yaw)*forward+Math.cos(player.yaw)*side)*speed*dt,vz=(-Math.cos(player.yaw)*forward+Math.sin(player.yaw)*side)*speed*dt;
if(!collides(player.pos.x+vx,player.pos.y,player.pos.z))player.pos.x+=vx;if(!collides(player.pos.x,player.pos.y,player.pos.z+vz))player.pos.z+=vz;
if((keys[' ']||keys.w&&keys[' '])&&player.onGround){player.vel.y=8;player.onGround=false}player.vel.y-=22*dt;let ny=player.pos.y+player.vel.y*dt;if(collides(player.pos.x,ny,player.pos.z)){if(player.vel.y<0)player.onGround=true;player.vel.y=0}else{player.pos.y=ny;player.onGround=false}
if(player.pos.y< -8){player.pos.set(0,8,7);player.vel.set(0,0,0)}
camera.position.copy(player.pos);camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=player.pitch;
frames++;if(now-stamp>1000){stats.textContent=frames+' FPS · '+blocks.size+' blocos';frames=0;stamp=now}renderer.render(scene,camera)}
requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
